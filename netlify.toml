# Netlify configuration for GuitarTribe (Next.js 15 App Router)

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # @netlify/plugin-nextjs v5 requires Node 22+
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Do NOT set PRISMA_CLI_BINARY_TARGETS here. That variable rejects the
  # "native" target and breaks `prisma generate`. Binary targets are declared
  # in prisma/schema.prisma instead.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Scheduled functions (replaces vercel.json crons)
# Schedules are declared inside each function file via `export const config`.
# ---------------------------------------------------------------------------

[functions]
  node_bundler = "esbuild"
  included_files = [
    "prisma/**",
    "node_modules/.prisma/**",
    "node_modules/@prisma/engines/**",
  ]

[functions."*"]
  external_node_modules = ["@prisma/client", ".prisma/client"]

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
