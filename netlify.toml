# Netlify configuration for GuitarTribe (Next.js 15 App Router)
#
# Requires the official Next.js Runtime:
#   npm i -D @netlify/plugin-nextjs

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Prisma needs this on Netlify's build image
  PRISMA_CLI_BINARY_TARGETS = "native,rhel-openssl-3.0.x"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Scheduled functions (replaces vercel.json crons)
# ---------------------------------------------------------------------------

[functions]
  node_bundler = "esbuild"
  # Prisma engine + schema must be bundled with the functions
  included_files = ["prisma/**", "node_modules/.prisma/**", "node_modules/@prisma/engines/**"]

[functions."crawl-brands"]
  schedule = "0 2 * * *"

[functions."crawl-prices"]
  schedule = "0 */6 * * *"

[functions."reindex"]
  schedule = "30 3 * * *"

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
