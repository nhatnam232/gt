# Netlify configuration for GuitarTribe (Next.js 15 App Router)

[build]
  # PRISMA_CLI_BINARY_TARGETS is unset defensively: that variable rejects the
  # "native" target and breaks `prisma generate`. If it is still defined in the
  # Netlify UI it would override netlify.toml, so we strip it from the shell
  # right before building. Binary targets live in prisma/schema.prisma instead.
  command = "unset PRISMA_CLI_BINARY_TARGETS; npm run build"
  publish = ".next"

[build.environment]
  # @netlify/plugin-nextjs v5 requires Node 22+
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Functions
# Scheduled functions declare their cron inside each file via `export const config`.
# ---------------------------------------------------------------------------

[functions]
  node_bundler = "esbuild"
  included_files = [
    "prisma/**",
    "node_modules/.prisma/**",
    "node_modules/@prisma/engines/**",
  ]

[functions."*"]
  external_node_modules = ["@prisma/client", ".prisma/client"]

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
