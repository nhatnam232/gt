# Netlify configuration for GuitarTribe (Next.js 15 App Router)

[build]
  # PRISMA_CLI_BINARY_TARGETS is unset defensively: that variable rejects the
  # "native" target and breaks `prisma generate`. If it is still defined in the
  # Netlify UI it would override netlify.toml, so we strip it from the shell
  # right before building. Binary targets live in prisma/schema.prisma instead.
  #
  # The build runs four steps in order:
  #   1. `prisma generate` builds the query engine for this machine. It has to
  #      come first because step 3 opens a real database connection, and
  #      `npm run build` (step 4) is otherwise the only thing that generates.
  #   2. `prisma db push` reconciles the live database with schema.prisma.
  #      There is no prisma/migrations directory, so `migrate deploy` would be a
  #      no-op. Idempotent: once the tables match, it does nothing.
  #   3. `db:seed` inserts reference data (brands, sources, ranking definitions).
  #      Every write in prisma/seed.ts is an upsert keyed by slug, so re-running
  #      it on each deploy never duplicates or deletes rows. It does NOT create
  #      guitar products - those come from the ETL crawler (`npm run etl:all`).
  #   4. `npm run build` builds Next.js. Several routes query the database from
  #      generateStaticParams, which is why the earlier steps come first.
  command = "unset PRISMA_CLI_BINARY_TARGETS; npx prisma generate && npx prisma db push --skip-generate && npm run db:seed && npm run build"
  publish = ".next"

[build.environment]
  # @netlify/plugin-nextjs v5 requires Node 22+
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Functions
# Scheduled functions declare their cron inside each file via `export const config`.
# ---------------------------------------------------------------------------

[functions]
  node_bundler = "esbuild"
  included_files = [
    "prisma/**",
    "node_modules/.prisma/**",
    "node_modules/@prisma/engines/**",
  ]

[functions."*"]
  external_node_modules = ["@prisma/client", ".prisma/client"]

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
